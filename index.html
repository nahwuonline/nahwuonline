<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nahwu Online - Kitab Interaktif</title>
  
  <!-- FAVICON & IKON HOMESCREEN HP -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- FONTS -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  
  <style>
    :root {
      --primary: #1e293b;
      --brand: #2563eb;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --correct: #10b981;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 1.5rem 0.75rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
    }
    .header p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* SELECTOR & PROGRES */
    select {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .progress-bar-container {
      background: #e2e8f0;
      border-radius: 10px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .progress-bar {
      height: 100%;
      background: var(--correct);
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    /* TEKS KITAB AREA */
    .text-box {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      direction: rtl;
      line-height: 2.5;
    }

    /* ARABIC WORD BADGE */
    .word {
      font-family: 'Amiri', serif;
      font-size: 1.4rem;
      padding: 0 0.25rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .word:hover {
      background: #eff6ff;
    }

    /* FOOTER */
    .reset-btn {
      margin-top: 1.5rem;
      background: none;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .reset-btn:hover {
      background: #f1f5f9;
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>NAHWU ONLINE</h1>
      <p>Platform Belajar dan Latihan Baca Kitab Salaf Interaktif</p>
    </div>

    <select id="chapter-select">
      <option value="1">📘 Pasal 1: Jenis & Pembagian Air (Anwa'ul Miyah)</option>
    </select>

    <div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-text">
        <span>Progres Hafalan & I'rab</span>
        <span id="progress-text">0% (0/0 Kata)</span>
      </div>
    </div>

    <!-- AREA TEKS KITAB -->
    <div class="text-box" id="text-container">
      <span class="word">كِتَابُ</span>
      <span class="word">الطَّهَارَةِ</span>
      <span class="word">،</span>
      <span class="word">أَنْوَاعُ</span>
      <span class="word">الْمِيَاهِ</span>
      <span class="word">الَّتِي</span>
      <span class="word">يَجُوزُ</span>
      <span class="word">بِهَا</span>
      <span class="word">التَّطْهِيرُ</span>
      <span class="word">سَبْعُ</span>
      <span class="word">مِيَاهٍ</span>
      <span class="word">.</span>
    </div>

    <button class="reset-btn">🗑️ Reset Semua</button>
  </div>

</body>
</html>
